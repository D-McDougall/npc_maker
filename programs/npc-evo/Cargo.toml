[package]
    name = "npc-evo"
    version = "0.1.0"
    edition = "2024"
    license = "MIT-0"
    description = "Example evolutionary algorithms for the NPC Maker"
    repository = "https://github.com/D-McDougall/npc_maker"
    categories = ["science"]
    keywords = ["ai", "alife", "evolution", "npc_maker"]

[dev-dependencies]
    process_anywhere = "0.5"

[dependencies]
    mate_selection = "0.1.2"
    npc_maker = {path = "../../rust/"}
    rand = "0.10.2"
    serde = "1.0.229"
    serde_json = "1.0.151"
    thiserror = "2.0.21"
    tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tokio-stream = "0.1.19"
    tonic = "0.14"
