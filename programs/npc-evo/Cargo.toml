[package]
    name = "npc-evo"
    version = "0.1.0"
    edition = "2024"
    rust-version = "1.86"
    license = "MIT-0"
    description = "Example evolutionary algorithms for the NPC Maker"
    repository = "https://github.com/D-McDougall/npc_maker"
    categories = ["science"]
    keywords = ["ai", "alife", "evolution", "npc_maker"]

[dev-dependencies]
    process_anywhere = "0.5"

[dependencies]
    mate_selection = "0.1.2"
    npc_maker = {path = "../../rust/"}
    rand = "0.10.2"
    serde = "1.0.229"
    serde_json = "1.0.151"
