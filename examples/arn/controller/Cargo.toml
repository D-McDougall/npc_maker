[package]
    name        = "arn"
    edition     = "2024"
    description = "Artificial Regulatory Network Controller for the NPC Maker"

[dependencies]
    npc_maker   = {path = "../../../rust"}
    ndarray     = {version = "0.16", features = ["serde"]}
    serde       = {version = "1.0", features = ["derive"]}
    serde_json  = {version = "1.0"}
    tokio       = {version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"]}
    tokio-stream = {version = "0.1", features = ["net"]}
    tonic       = "0.14"
