[package]
    name            = "xor"
    version         = "0.1.0"
    edition         = "2021"
    description     = "Exclusive-Or environment for the NPC Maker"
    keywords        = ["npc-maker", "environment"]

[dependencies]
    npc_maker           = { path = "../../rust/" }
    serde               = { version = "1" }
    serde_json          = { version = "1" }
    tokio               = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
    tokio-stream        = { version = "0.1" }
    tonic               = { version = "0.14" }
