syntax = "proto3";

import "individual.proto";

package evolution;

/*
The Evolution service manages a population.

An evolution service receives individuals after they die and is responsible for
deciding which of those individuals can reproduce. It may implement any
evolutionary algorithm, including a conventional genetic algorithm, artificial
selection, speciation, replay of previously successful individuals, or a
combination of these.

The selected parent Individuals are passed to the Genetics service, which
creates the child. If the genetic service is missing, then the first parent
will be cloned into the environment.

# Lifecycle

1. The npc-server calls `Spawn()` when the environment requests a new individual.

2. The Evolution service returns zero or more parent Individuals. If the
   Evolution service is missing then zero parents are implicitly returned.

3. If one or more parents are returned, the npc-server passes them to the
   Genetics service to create the child. If zero parents are returned, the
   Genetics service uses the initial genetic material instead.

4. While the individual is alive, the environment updates the npc-server's copy
   of the Individual with its current score, telemetry, and epigenome.

5. When the individual dies, the npc-server calls Death() with its final
   Individual record.

*/
service Evolution {
  /*
  Selects the parent Individuals to create a new child individual.

  The request contains no parameters because parent selection is controlled
  entirely by the Evolution service. The service may use its population,
  historical fitness, species, lineage, randomness, or any other information
  available to it when making the selection.

  The response may contain any number of parents.

  A response containing zero parents means that the genetics service will create
  a founder using the initial genetic material.
  */
  rpc Spawn(SpawnRequest) returns (SpawnResponse);

  /*
  Notifies the Evolution service that an Individual has died.

  The request contains the npc-server's final copy of the Individual. The record
  includes information accumulated during the individual's life, including its
  final score, telemetry, and epigenome, as well as its immutable genome,
  phenome, and lineage metadata.

  The Evolution service may retain the Individual for future parent selection,
  statistics, persistence, or replay.
  */
  rpc Death(DeathRequest) returns (DeathResponse);
}

message SpawnRequest {
}

message SpawnResponse {
  repeated individual.Individual parents = 1;
}

message DeathRequest {
  individual.Individual individual = 1;
}

message DeathResponse {
}
