syntax = "proto3";

package individual;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

/*
Individuals are the entities that evolve

# File Format

The file format for an individual consists of a directory named after the
individual's name. The directory contains four files: metadata.json, which
contains the individual's metadata serialized using the protobuf JSON mapping,
and genome, epigenome, and phenome, which contain the corresponding data as raw
binary.

# Lifecycle

There are several pathways for creating individuals, depending on how the
environment requests them, and which services are available.

## Spawn Sequence

1) The environment requests a new individual from the npc-server via
`environment.Environment::Spawn()`.

2) The npc-server requests parents from the evolution service via
`evolution.Evolution::Spawn()`. If the evolution service is missing then the
parents default to an empty list, which will request a founder from the
genetics service.

3) The npc-server forwards the parents to the genetics service via
`genetics.Genetics::Reproduce()`. The genetics service creates a new Individual
and returns it to the npc-server. If the genetics service is missing then the
first parent is cloned.

4) The npc-server sends the Individual to the environment. The npc-server also
keeps a copy of the individual locally.

## Mate Sequence

1) The environment requests to mate some individuals via
`environment.Environment::Mate()`. Parents are specified by name, and the
npc-server will have copies of the individuals on hand while they are alive and
in the environment.

2) The npc-server forwards the given parents to the genetics service via
`genetics.Genetics::Reproduce()`. The genetics service creates a new Individual
and returns it to the npc-server. If the genetics service is missing then the
first parent is cloned.

3) The npc-server sends the Individual to the environment. The npc-server also
keeps a copy of the individual locally.

## Replay Sequence

This sequence resurrects dead Individuals, for example to recreate the best
performing individuals from a leaderboard. See program `npc-player` for more
information about using this sequence.

1) The environment requests a new Individual via either the spawn or mate
sequence.

2) The npc-server requests an Individual from the evolution service via
`evolution.Evolution::Spawn()`. At least one parent must be returned.

3) The genetics service is missing, so the first parent is cloned and the
remaining parents are discarded.

4) The npc-server sends the Individual to the environment. The npc-server also keeps a
copy of the individual locally.

## Life Sequence

1) The environment requests a new Individual via either the spawn or mate
sequence. The npc-server may choose to ignore mate requests and return a
spawned or replayed individual instead.

2) The environment synchronizes their copy of the Individual with the npc-server
via the RPC:
* `environment.Environment::Telemetry()`
* `environment.Environment::Epigenome()`
* `environment.Environment::Score()`

3) The environment declares the Individual dead via the RPC:
`environment.Environment::Death()`.

4) The npc-server sends its copy of the Individual to the evolution service via
the RPC: `evolution.Evolution::Death()`.

## Field Ownership

| Field | Set By | When |
| ----- | ------ | ---- |
| `metadata` | Genetics | at creation |
| `genome` | Genetics | at creation |
| `epigenome` |  |  |
| `phenome` | Genetics | at creation |
| `metadata.name` | Genetics | at creation |
| `metadata.environment` |  |  |
| `metadata.body_type` |  |  |
| `metadata.controller` | npc-server |  |
| `metadata.score` | Environment | while alive |
| `metadata.telemetry` | Environment | while alive |
| `metadata.species` | Genetics | at creation |
| `metadata.parents` |  |  |
| `metadata.children` |  |  |
| `metadata.generation` |  |  |
| `metadata.ascension` | Evolution | death |
| `metadata.birth_date` | npc-server | birth |
| `metadata.death_date` | npc-server | death |

*/
message Individual {
  /*
  The metadata contains all human-readable / non-genetic information about the
  individual.

  This field is required.
  */
  Metadata metadata = 1;

  /*
  */
  optional bytes genome = 2;

  /*
  The epigenome is created by the controller.

  The purpose of the epigenome is to allow self-modifying controllers to persist
  their modifications over reproductive cycles.
  */
  optional bytes epigenome = 3;

  /*
  The phenome is sent to the controller.

  The purpose of the phenome is to simplify the controller's design, by allowing
  the genetic module to reformat the genome before transmission.
  */
  optional bytes phenome = 4;
}

/*
Metadata for an Individual

This contains the individual's human readable data.
*/
message Metadata {
  /*
  UUID of this individual

  Typically, this will be a 128 bit random number as 32 uppercase hex digits
  (UUID-4), but technically it can be any string that is universally unique
  among all individuals.

  This must be a valid file system directory name.
  */
  string name = 1 [
    json_name = "name"
  ];

  /*
  Name of the environment that this individual lives in
  */
  optional string environment = 2 [
    json_name = "environment"
  ];

  /*
  Name of the body type used by this individual.
  */
  optional string body_type = 3 [
    json_name = "body_type"
  ];

  /*
  Command-line invocation of the controller program
  */
  repeated string controller = 4 [
    json_name = "controller"
  ];

  /*
  Reproductive fitness of this individual, as assessed by the environment.

  Higher is better.

  Unset and NaN values are translated to -∞.
  */
  optional double score = 5 [
    json_name = "score"
  ];

  /*
  Environmental information
  */
  map<string, string> telemetry = 6 [
    json_name = "telemetry"
  ];

  /*
  UUID for artificial speciation
  */
  optional string species = 7 [
    json_name = "species"
  ];

  /*
  Names of parents
  */
  repeated string parents = 8 [
    json_name = "parents"
  ];

  /*
  Number of children
  */
  optional uint64 children = 9 [
    json_name = "children"
  ];

  /*
  Number of generations that came before this individual.

  This is the lineage depth, which is defined highest generation among its
  parents plus one, with 0 for founders.
  */
  optional uint64 generation = 10 [
    json_name = "generation"
  ];

  /*
  Number of individuals who died before this one.

  This is 0-based and counted separately for each body type.

  The Evolution service assigns this.
  */
  optional uint64 ascension = 11 [
    json_name = "ascension"
  ];

  /*
  UTC time at which this individual was born.

  This is assigned by the npc-server program, immediately before sending the
  individual to the environment.
  */
  optional google.protobuf.Timestamp birth_date = 12 [
    json_name = "birth_date"
  ];

  /*
  UTC time at which this individual died.

  This is assigned by the npc-server program, immediately after receiving the
  corresponding death message.
  */
  optional google.protobuf.Timestamp death_date = 13 [
    json_name = "death_date"
  ];
}
