[package]
    name = "npc_maker"
    version = "0.3.0"
    edition = "2024"
    license = "MIT-0"
    description = "Evolve AIs in simulated environments"
    repository = "https://github.com/D-McDougall/npc_maker"
    categories = ["science"]
    keywords = ["ai", "alife", "evolution", "npc_maker"]

[lib]
    doctest = false

[dependencies]
    chrono              = { version = "0.4" }
    mate_selection      = { version = "0.1" }
    rand                = { version = "0.10" }
    serde               = { version = "1.0", features = ["derive"] }
    serde_json          = { version = "1.0", features = ["float_roundtrip"] }
    thiserror           = { version = "2.0" }
    tonic               = "0.14"
    tonic-prost         = "0.14"
    prost               = "0.14"
    pbjson              = "0.9.0"
    pbjson-types        = "0.9.0"

[build-dependencies]
    tonic-prost-build   = "0.14"
    pbjson-build        = "0.9"
    protoc-bin-vendored = "3.2.0"
